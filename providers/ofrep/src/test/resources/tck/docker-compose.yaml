# Backend stack for the OpenFeature Provider TCK, wrapping the unmodified flagd testbed image.
#
# OFREP is a vendor-neutral protocol, so the TCK does not need an OFREP-specific testbed: any
# backend that speaks OFREP and exposes the control API will do. flagd serves the OFREP HTTP API
# on 8016 alongside its own gRPC surfaces, and the testbed image already ships the "launchpad"
# control API on 8080 — the same stack the flagd provider's TCK suite uses, seeded with the same
# flag set. No new image, no new control API.
#
# That flag set is not yet the whole canonical one: v3.8.0 has none of large-integer-flag,
# huge-integer-flag or integral-float-flag. Only large-integer-flag is reached by a scenario that
# runs here -- the other two sit behind @large-integers and @numeric-coercion, neither of which
# this provider declares -- so one untagged scenario fails FLAG_NOT_FOUND until
# open-feature/flagd-testbed#392 lands. Bump the tag then.
#
# Note there are no host port bindings. The TCK requires dynamically mapped ports and discovers
# them after startup — a pinned host port would make the suite unrunnable in parallel and would
# collide with a developer's local flagd.
services:
  backend:
    image: ghcr.io/open-feature/flagd-testbed:v3.8.0
    ports:
      - 8016   # flagd OFREP evaluation (HTTP)
      - 8080   # launchpad control API
